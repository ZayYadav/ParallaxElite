name: Build ParallaxElite SDK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'src/**'
      - '.github/workflows/build-sdk.yml'

permissions:
  contents: read

jobs:
  build-sdk:
    name: Build release AAR
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_API: '36'
      BUILD_TOOLS: '36.0.0'
      NDK_VERSION: '27.2.12479018'
      GRADLE_VERSION: '8.13'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Install Android platform, build tools and NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}"

      - name: Configure Android SDK path
        shell: bash
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "${ANDROID_HOME}" > local.properties
          gradle --version

      - name: Build ParallaxElite release AAR
        shell: bash
        run: |
          set -euo pipefail
          gradle clean assembleRelease --no-daemon --stacktrace

      - name: Verify release artifact
        shell: bash
        run: |
          set -euo pipefail
          AAR="$(find build/outputs/aar -maxdepth 1 -type f -name '*-release.aar' -print -quit)"
          if [ -z "${AAR}" ]; then
            echo "Release AAR was not generated." >&2
            find build -maxdepth 5 -type f | sort || true
            exit 1
          fi

          unzip -t "${AAR}"
          mkdir -p release-artifact
          cp "${AAR}" release-artifact/ParallaxElite-release.aar
          sha256sum release-artifact/ParallaxElite-release.aar | tee release-artifact/SHA256SUMS.txt

          {
            echo "panel=https://parallaxloadersdk.parallaxserver.online/connect.php"
            echo "api_version=3"
            echo "android_api=${ANDROID_API}"
            echo "ndk=${NDK_VERSION}"
          } > release-artifact/BUILD_INFO.txt

      - name: Upload ParallaxElite SDK
        uses: actions/upload-artifact@v4
        with:
          name: ParallaxElite-release-sdk
          path: release-artifact/
          if-no-files-found: error
          retention-days: 30
