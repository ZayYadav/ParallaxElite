name: Build ParallaxElite SDK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'proguard-rules.pro'
      - 'proguard.txt'
      - 'src/**'
      - '.github/workflows/build-sdk.yml'

permissions:
  contents: read

jobs:
  build-sdk:
    name: Build release AAR
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_API: '36'
      BUILD_TOOLS: '36.0.0'
      NDK_VERSION: '27.2.12479018'
      GRADLE_VERSION: '8.13'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Install Android platform, build tools and NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}"

      - name: Configure Android SDK path
        shell: bash
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "${ANDROID_HOME}" > local.properties
          gradle --version

      - name: Build ParallaxElite release AAR
        shell: bash
        run: |
          set -euo pipefail
          gradle clean assembleRelease --no-daemon --stacktrace

      - name: Verify release artifact
        shell: bash
        run: |
          set -euo pipefail
          AAR="$(find build/outputs/aar -maxdepth 1 -type f -name '*-release.aar' -print -quit)"
          if [ -z "${AAR}" ]; then
            echo "Release AAR was not generated." >&2
            find build -maxdepth 5 -type f | sort || true
            exit 1
          fi

          unzip -t "${AAR}"

          VERIFY_DIR="${RUNNER_TEMP}/parallaxelite-aar"
          rm -rf "${VERIFY_DIR}"
          mkdir -p "${VERIFY_DIR}"
          unzip -q "${AAR}" -d "${VERIFY_DIR}"

          test -f "${VERIFY_DIR}/classes.jar"
          test -f "${VERIFY_DIR}/AndroidManifest.xml"
          test -f "${VERIFY_DIR}/jni/arm64-v8a/libEliteCore.so"
          test -f "${VERIFY_DIR}/jni/armeabi-v7a/libEliteCore.so"

          echo "Verifying arm64-v8a ELF LOAD alignment (Android 15/16 16-KB pages)"
          readelf -lW "${VERIFY_DIR}/jni/arm64-v8a/libEliteCore.so" | tee "${VERIFY_DIR}/arm64-readelf.txt"
          python3 - "${VERIFY_DIR}/arm64-readelf.txt" <<'PY'
          import sys

          path = sys.argv[1]
          alignments = []
          with open(path, "r", encoding="utf-8", errors="replace") as handle:
              for line in handle:
                  parts = line.split()
                  if parts and parts[0] == "LOAD":
                      alignments.append(int(parts[-1], 16))

          if not alignments:
              raise SystemExit("No ELF LOAD segments found")
          if any(value < 0x4000 for value in alignments):
              raise SystemExit(
                  "arm64 LOAD alignment below 16 KB: "
                  + ", ".join(hex(value) for value in alignments)
              )
          print("arm64 LOAD alignments:", ", ".join(hex(value) for value in alignments))
          PY

          mkdir -p release-artifact
          cp "${AAR}" release-artifact/ParallaxElite-release.aar
          sha256sum release-artifact/ParallaxElite-release.aar | tee release-artifact/SHA256SUMS.txt

          {
            echo "panel=https://parallaxloadersdk.parallaxserver.online/connect.php"
            echo "api_version=3"
            echo "android_api=${ANDROID_API}"
            echo "ndk=${NDK_VERSION}"
            echo "abis=arm64-v8a,armeabi-v7a"
            echo "arm64_flexible_page_size_verified=true"
          } > release-artifact/BUILD_INFO.txt

      - name: Upload ParallaxElite SDK
        uses: actions/upload-artifact@v4
        with:
          name: ParallaxElite-release-sdk
          path: release-artifact/
          if-no-files-found: error
          retention-days: 30
