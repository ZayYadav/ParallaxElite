buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.20'
        classpath 'org.lsposed.lsparanoid:gradle-plugin:0.6.0'
    }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.lsposed.lsparanoid'

repositories {
    google()
    mavenCentral()
    maven {
        url 'https://jitpack.io'
        content {
            includeGroupByRegex 'com\\.github\\..*'
        }
    }
}

ext {
    minSdk = 24
    targetSdk = 36
    compileSdk = 36
    buildToolsVersion = '36.0.0'
    ndkVersion = '27.2.12479018'
}

def sdkPanelEndpoint = 'https://parallaxloadersdk.parallaxserver.online/connect.php'
def sdkPanelKeyId = 'parallax-2026-09'
def sdkPanelEcdhPublicKey = 'MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE8FaLLJyEs4s6PwotLl/4QPo4u/e7BykS9N9x6Vmay/BDtVHgorPldGxAlET4rJXGuckHzWuZ6oBHpYIVY9nsvA=='
def sdkPanelSigningPublicKey = 'MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEn2ZzqmASjb6P3QoSqafVYzXCtuo54BkVitVeNEv9Pm6+vptUJy2YNAafjIVeSonL/VXOjNpxBjOWnd3zLnXLjw=='
def quoteBuildConfig = { String value -> '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"' }

lsparanoid {
    seed = 0x454C4954
    includeDependencies = false
    variantFilter = { variant -> variant.buildType == 'release' }
}

android {
    namespace "com.elite"
    compileSdk rootProject.ext.compileSdk
    buildToolsVersion rootProject.ext.buildToolsVersion
    ndkVersion rootProject.ext.ndkVersion

    aidlPackagedList "android/app/IServiceConnection.aidl"
    aidlPackagedList "android/accounts/IAccountManagerResponse.aidl"

    defaultConfig {
        minSdk rootProject.ext.minSdk
        targetSdk rootProject.ext.targetSdk
        versionCode 1
        versionName "1.0"
        consumerProguardFiles 'proguard.txt'

        buildConfigField 'String', 'SDK_PANEL_ENDPOINT', quoteBuildConfig(sdkPanelEndpoint)
        buildConfigField 'String', 'SDK_PANEL_KEY_ID', quoteBuildConfig(sdkPanelKeyId)
        buildConfigField 'String', 'SDK_PANEL_ECDH_PUBLIC_KEY', quoteBuildConfig(sdkPanelEcdhPublicKey)
        buildConfigField 'String', 'SDK_PANEL_SIGNING_PUBLIC_KEY', quoteBuildConfig(sdkPanelSigningPublicKey)

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/cpp/Android.mk"
        }
    }

    compileOptions {
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    buildFeatures {
        aidl true
        prefab true
        buildConfig true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
        warningsAsErrors false
        disable "UnusedResources", "RestrictedApi"
        textReport false
        checkOnly += ["NewApi", "InlinedApi"]
    }
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addStringOption('encoding', 'UTF-8')
    options.addStringOption('charSet', 'UTF-8')
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.github.tiann:FreeReflection:3.2.2'
    implementation 'com.github.CodingGay.BlackReflection:core:1.1.2'
    annotationProcessor 'com.github.CodingGay.BlackReflection:compiler:1.1.2'

    compileOnly "com.google.auto.service:auto-service:1.1.1"
    annotationProcessor "com.google.auto.service:auto-service:1.1.1"
    implementation "com.squareup:javapoet:1.13.0"
    implementation "javax.annotation:javax.annotation-api:1.3.2"
    testImplementation 'junit:junit:4.13.2'
}
